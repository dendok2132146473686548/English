<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>English Practice — Real Conversations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main id="views">
    <!-- HOME -->
    <section class="view active" data-view="home">
      <div class="home-inner">
        <h1>English Practice</h1>
        <p class="subtitle">Practice real conversations with AI.</p>

        <div class="field">
          <label>Level</label>
          <div id="home-levels" class="pill-row"></div>
        </div>

        <div class="field">
          <label>Situation</label>
          <div id="home-cats" class="pill-row"></div>
        </div>

        <button class="btn primary large" id="btn-start">Start</button>
        <button class="btn ghost large" id="btn-surprise-home" style="margin-top:10px">Surprise Me</button>

        <p class="hint-text">AI will create a unique situation for your level.</p>
      </div>
    </section>

    <!-- PRACTICE / SCENARIO -->
    <section class="view" data-view="practice">
      <header class="practice-head">
        <button class="icon-btn" id="btn-back-home">‹</button>
        <div>
          <b id="practice-category"></b>
          <small id="practice-goal"></small>
        </div>
        <span id="practice-step" class="step"></span>
      </header>

      <div id="practice-context" class="context"></div>

      <div id="chat"></div>

      <div id="feedback" class="feedback hidden"></div>

      <div id="input-area">
        <div id="hint-area" class="hint hidden"></div>
        <label class="field-label">Your answer</label>
        <textarea id="answer-input" placeholder="Type your answer..." rows="2"></textarea>
        <div class="input-actions">
          <button id="btn-speak" class="chip">🎤 Speak</button>
          <button id="btn-hint" class="chip">Hint</button>
          <button id="btn-send" class="btn primary">Send</button>
        </div>
        <div id="voice-hold" class="voice-hold hidden">
          <button id="btn-hold" class="hold-btn">Hold to speak</button>
          <span id="voice-text"></span>
        </div>
      </div>
    </section>

    <!-- RESULT -->
    <section class="view" data-view="result">
      <div class="result-inner">
        <h2>Scenario Complete</h2>
        <div class="score-big"><span id="result-score">0%</span></div>
        <div id="result-breakdown" class="breakdown"></div>
        <div id="result-main" class="result-main"></div>
        <div class="result-actions">
          <button class="btn primary" id="btn-try-again">Try Again</button>
          <button class="btn" id="btn-new-situation">New Situation</button>
          <button class="btn ghost" id="btn-go-history">History</button>
        </div>
      </div>
    </section>

    <!-- HISTORY -->
    <section class="view" data-view="history">
      <h2 class="page-title">History</h2>
      <p class="page-sub">Your past situations and real mistakes.</p>
      <div id="history-errors" class="history-block"></div>
      <div id="history-list" class="history-list"></div>
      <p id="history-empty" class="muted" style="text-align:center;padding:24px;display:none">No history yet. Start a situation.</p>
    </section>

    <!-- SETTINGS -->
    <section class="view" data-view="settings">
      <h2 class="page-title">Settings</h2>
      <div class="settings-card">
        <div class="field">
          <label>Level</label>
          <div id="settings-levels" class="pill-row"></div>
        </div>
        <label class="switch-row">Sound <input type="checkbox" id="tg-sound" checked></label>
        <button class="btn danger wide" id="btn-reset" style="margin-top:16px">Reset history</button>
      </div>
      <p class="muted" style="margin-top:16px;font-size:12px">All data is stored locally. No server.</p>
    </section>
  </main>

  <nav id="bottom-nav">
    <button data-nav="home" class="nav-btn active">Home</button>
    <button data-nav="history" class="nav-btn">History</button>
    <button data-nav="settings" class="nav-btn">Settings</button>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/generator.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
